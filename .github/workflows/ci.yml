name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 es el mínimo que declara `engines`; probarlo es lo que sostiene esa promesa.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      # `tsc` sin emitir tumba el job ante un error de tipos; `pretest` compila.
      - run: npx tsc --noEmit
      - run: npm test --if-present

  smoke:
    name: Smoke en las dos eras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      # Llama a todas las tools por el protocolo real, una vez por era, y valida
      # `structuredContent` contra el esquema de cada una. Toca la red de verdad.
      - run: npm run smoke

  package:
    name: Paquete npm por npx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: server.json declara la misma versión y mcpName que package.json
        run: |
          test "$(jq -r .name server.json)" = "$(jq -r .mcpName package.json)"
          test "$(jq -r .version server.json)" = "$(jq -r .version package.json)"
          test "$(jq -r '.packages[0].version' server.json)" = "$(jq -r .version package.json)"

      - run: npm ci
      # `npm pack` corre `prepack` (build), así que prueba lo mismo que se publicaría.
      - run: npm pack

      - name: El tarball se instala con npx y responde initialize por stdio
        run: |
          tgz=$(ls *.tgz | head -1)
          name=$(tar -xzOf "$tgz" package/package.json | jq -r .name)
          if tar -tzf "$tgz" | grep -E '\.(map|d\.ts)$'; then
            echo "El paquete lleva source maps o declaraciones" >&2
            exit 1
          fi
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 120 npx --yes --package "./$tgz" "$name" | head -1)
          echo "$out"
          echo "$out" | jq -e --arg n "$name" '.result.serverInfo.name == $n' >/dev/null

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: docker build -t mcp-ci .

      - name: El contenedor arranca, responde /healthz y lista sus tools por HTTP
        run: |
          docker run -d --name mcp-ci -p 3000:3000 mcp-ci
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/healthz
          echo
          n=$(curl -sf -X POST http://127.0.0.1:3000/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'mcp-protocol-version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | sed -n 's/^data: //p' | jq '.result.tools | length')
          echo "tools/list: ${n:-sin respuesta}"
          if [ -z "$n" ] || [ "$n" -eq 0 ]; then
            docker logs mcp-ci
            exit 1
          fi
